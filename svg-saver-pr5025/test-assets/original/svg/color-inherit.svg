<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <rect width="320" height="100" fill="#ffffff"/>
  <!-- A (reference): fill-opacity 0.5 - not affected by this PR -->
  <rect x="10"  y="20" width="60" height="60" fill="#ff0000" fill-opacity="0.5"/>
  <!-- B: opacity 0.5 - must look identical to A -->
  <rect x="110" y="20" width="60" height="60" fill="#ff0000" opacity="0.5"/>
  <!-- C: color + opacity 0.5 - must also look identical to A -->
  <g color="#ff0000" opacity="0.5">
    <rect x="210" y="20" width="60" height="60" fill="currentColor"/>
  </g>
</svg>
